<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | CargoMate</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>.auth-field{display:block;margin-top:15px}.auth-field[hidden],.auth-continue[hidden]{display:none!important}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #dbe4f0}.auth-tabs button{padding:12px;border:0;border-bottom:2px solid transparent;background:#fff;color:#64748b;font-weight:800;cursor:pointer}.auth-tabs button.is-active{border-bottom-color:#1479ff;color:#1479ff}.auth-tabs button:focus-visible{outline:3px solid rgba(20,121,255,.25);outline-offset:2px}</style>
</head>
<body data-login-page="true">
  <header class="header"><div class="container nav"><span class="brand"><span class="brand-icon"><i class="fa-solid fa-cubes-stacked"></i></span>화물메이트 <small>CargoMate</small></span></div></header>
  <main style="min-height:calc(100vh - 132px);display:grid;place-items:center;padding:60px 20px"><section class="card" style="width:min(100%,440px);padding:34px">
    <div class="auth-tabs" role="tablist" aria-label="인증 방식"><button class="is-active" data-auth-mode="login" type="button" role="tab" aria-selected="true" tabindex="0">로그인</button><button data-auth-mode="signup" type="button" role="tab" aria-selected="false" tabindex="-1">회원가입</button></div>
    <h1 id="authTitle" style="font-size:25px">다시 만나서 반가워요</h1><p class="muted">로그인해야 화물메이트의 매칭·계산·마이페이지 기능을 이용할 수 있습니다.</p>
    <form id="loginForm" data-mode="login" style="margin-top:20px">
      <label id="nameField" class="auth-field" hidden>이름<input name="name" autocomplete="name" placeholder="표시할 이름"></label>
      <label class="auth-field">이메일<input name="email" type="email" autocomplete="email" required placeholder="name@company.com"></label>
      <label class="auth-field">비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상 입력"></label>
      <label id="confirmField" class="auth-field" hidden>비밀번호 확인<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="비밀번호를 한 번 더 입력"></label>
      <button class="btn" id="authSubmit" style="width:100%;margin-top:24px">로그인하기</button>
    </form><button class="btn auth-continue" data-auth-continue type="button" hidden style="width:100%;margin-top:12px">확인된 로그인으로 계속하기</button><p data-auth-message style="min-height:20px;font-size:13px" aria-live="polite"></p>
  </section></main>
  <footer class="footer">© 2026 CargoMate</footer><script src="auth-gate.js"></script><script type="module" src="firebase-auth.js?v=20260807-2"></script>
</body></html>
