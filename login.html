<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | CargoMate</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-login-page="true">
  <header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon"><i class="fa-solid fa-cubes-stacked"></i></span>화물메이트 <small>CargoMate</small></a></div></header>
  <main style="min-height:calc(100vh - 132px);display:grid;place-items:center;padding:60px 20px"><section class="card" style="width:min(100%,440px);padding:34px">
    <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #dbe4f0"><button data-auth-mode="login" type="button" style="padding:12px;border:0;border-bottom:2px solid #1479ff;background:white;color:#1479ff;font-weight:bold">로그인</button><button data-auth-mode="signup" type="button" style="padding:12px;border:0;background:white;color:#64748b;font-weight:bold">회원가입</button></div>
    <h1 id="authTitle" style="font-size:25px">다시 만나서 반가워요</h1><p class="muted">로그인하면 내 화물 그룹과 운임 계산 기능을 이용할 수 있습니다.</p>
    <form id="loginForm" data-mode="login" style="margin-top:20px">
      <label id="nameField" hidden style="display:block;margin-top:15px">이름<input name="name" autocomplete="name" placeholder="표시할 이름"></label>
      <label style="display:block;margin-top:15px">이메일<input name="email" type="email" autocomplete="email" required placeholder="name@company.com"></label>
      <label style="display:block;margin-top:15px">비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상 입력"></label>
      <label id="confirmField" hidden style="display:block;margin-top:15px">비밀번호 확인<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="비밀번호를 한 번 더 입력"></label>
      <button class="btn" id="authSubmit" style="width:100%;margin-top:24px">로그인하기</button>
    </form><p data-auth-message style="min-height:20px;font-size:13px" aria-live="polite"></p>
  </section></main>
  <footer class="footer">© 2026 CargoMate</footer><script type="module" src="firebase-auth.js"></script>
</body></html>
